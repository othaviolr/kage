spring:
  application:
    name: kage-banking-system
  devtools:
    add-properties: false
  datasource:
    url: jdbc:postgresql://localhost:5432/kage_db
    username: kage
    password: "kage123"
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  rabbitmq:
    host: localhost
    port: 5672
    username: kage
    password: kage_shadow_2024
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000
          multiplier: 2.0
          max-interval: 10000
        default-requeue-rejected: false

server:
  port: 8080

kage:
  security:
    jwt:
      # em produção: obrigatório via KAGE_JWT_SECRET (>= 32 bytes, aleatório). O default é só para dev.
      secret: ${KAGE_JWT_SECRET:dev-only-kage-jwt-secret-change-me-0123456789}
      ttl: ${KAGE_JWT_TTL:15m}
    admin:
      username: ${KAGE_ADMIN_USERNAME:admin}
      password: ${KAGE_ADMIN_PASSWORD:kage-admin-dev-123}
    bcrypt-strength: 12

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.kage: DEBUG