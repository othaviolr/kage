spring:
  application:
    name: kage-banking-system
  devtools:
    add-properties: false
  datasource:
    # 5433: porta do Postgres do docker-compose na máquina (ver comentário lá)
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/kage_db}
    username: kage
    password: "kage123"
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: ${KAGE_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  rabbitmq:
    host: localhost
    port: 5672
    username: kage
    password: kage_shadow_2024
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000
          multiplier: 2.0
          max-interval: 10000
        default-requeue-rejected: false

server:
  port: 8080

kage:
  security:
    jwt:
      # em produção: obrigatório via KAGE_JWT_SECRET (>= 32 bytes, aleatório). O default é só para dev.
      secret: ${KAGE_JWT_SECRET:dev-only-kage-jwt-secret-change-me-0123456789}
      ttl: ${KAGE_JWT_TTL:15m}
    admin:
      username: ${KAGE_ADMIN_USERNAME:admin}
      password: ${KAGE_ADMIN_PASSWORD:kage-admin-dev-123}
    bcrypt-strength: 12
    password-reset:
      # SÓ PARA DESENVOLVIMENTO: devolve o token de recuperação na resposta do /password/forgot
      # (não há envio de e-mail real). Em produção fica false.
      expose-token: ${KAGE_DEV_EXPOSE_RESET_TOKEN:false}
    login-code:
      # SÓ PARA DESENVOLVIMENTO: devolve o código do login em dispositivo novo na resposta do /login
      # (não há SMS real). Em produção fica false. Sem a variável própria, segue a do reset.
      expose-code: ${KAGE_DEV_EXPOSE_LOGIN_CODE:${KAGE_DEV_EXPOSE_RESET_TOKEN:false}}
  pix:
    # dispara os PIX agendados do dia logo depois do fim da janela noturna
    scheduler-enabled: ${KAGE_PIX_SCHEDULER_ENABLED:true}
    scheduled-cron: "0 0 6 * * *"
    zone: America/Sao_Paulo
  billing:
    # fecha faturas no dia de corte e cobra o débito automático no vencimento
    scheduler-enabled: ${KAGE_BILLING_SCHEDULER_ENABLED:true}
    cron: "0 0 3 * * *"
    zone: America/Sao_Paulo
  savings:
    # caixinhas: rende 100% do CDI por dia útil; o job rende o dia útil anterior
    scheduler-enabled: ${KAGE_SAVINGS_SCHEDULER_ENABLED:true}
    cron: "0 0 1 * * *"
    zone: America/Sao_Paulo
    # de onde vem o CDI: "bcb" = série 12 do Banco Central (real, só o passado);
    # "fixed" = annual-cdi nos dias úteis nacionais (determinístico; simula datas futuras)
    cdi-source: ${KAGE_SAVINGS_CDI_SOURCE:fixed}
    # fração ao ano (0.1415 = 14,15% a.a.), usada pela fonte fixa
    annual-cdi: ${KAGE_ANNUAL_CDI:0.1415}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.kage: DEBUG